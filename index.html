<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLR Live Dashboard — 연결 테스트</title>
<style>
  body{margin:0;background:#f5f6f8;color:#141922;font-family:'Malgun Gothic',-apple-system,sans-serif;padding:32px;}
  .w{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:#8b93a1;font-size:13px;margin-bottom:24px;}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid #e4e7ec;
    border-radius:10px;margin-bottom:10px;}
  .dot{width:12px;height:12px;border-radius:50%;background:#cbd5e1;flex:none;}
  .dot.ok{background:#15803d;} .dot.bad{background:#c0392b;} .dot.wait{background:#b26a00;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .lbl{font-weight:700;font-size:13.5px;min-width:220px;}
  .msg{font-size:12.5px;color:#4b5563;font-family:ui-monospace,monospace;}
  .box{margin-top:20px;padding:16px;border-radius:10px;font-size:13px;line-height:1.6;}
  .box.summary-ok{background:#e9f6ed;border:1px solid #bfe3ca;color:#0b6b3a;}
  .box.summary-bad{background:#fdecea;border:1px solid #f5c6c2;color:#c0392b;}
  .box.summary-wait{background:#fdf3e3;border:1px solid #f0d9ae;color:#b26a00;}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e4e7ec;border-radius:8px;font-size:13px;margin-top:6px;}
  button{margin-top:12px;padding:9px 16px;border-radius:8px;border:none;background:#0b6b3a;color:#fff;
    font-weight:700;font-size:13px;cursor:pointer;}
  button:hover{filter:brightness(1.1);}
  button:disabled{background:#cbd5e1;cursor:default;}
</style>
</head>
<body><div class="w">
  <h1>🔌 회사망 연결성 테스트</h1>
  <div class="sub">이 페이지가 열렸다는 것 자체가 GitHub Pages(youngjung-ai.github.io)는 뚫려있다는 뜻입니다. 아래 항목들을 추가로 확인합니다.</div>

  <div class="row"><span class="dot wait" id="d1"></span><span class="lbl">① raw.githubusercontent.com (공개 파일 읽기)</span><span class="msg" id="m1">확인 중…</span></div>
  <div class="row"><span class="dot wait" id="d2"></span><span class="lbl">② api.github.com (읽기 API)</span><span class="msg" id="m2">확인 중…</span></div>
  <div id="summary"></div>

  <div style="margin-top:28px;padding-top:20px;border-top:1px dashed #e4e7ec;">
    <div class="lbl" style="margin-bottom:6px;">③ 쓰기(업로드) 테스트 — 본인 토큰 필요</div>
    <div class="sub" style="margin:0 0 4px;">여기 입력한 토큰은 이 브라우저 메모리에서만 쓰이고 어디에도 저장·전송되지 않습니다 (테스트 후 새로고침하면 사라짐).</div>
    <input type="password" id="tok" placeholder="ghp_ 로 시작하는 토큰 붙여넣기">
    <button id="btnWrite">쓰기 테스트 실행</button>
    <div class="row" id="rowWrite" style="display:none;margin-top:12px;">
      <span class="dot wait" id="d3"></span><span class="lbl">쓰기(Contents API PUT)</span><span class="msg" id="m3"></span>
    </div>
  </div>
</div>

<script>
const OWNER='YoungJung-AI', REPO='jlr-live';
function setRow(id,msgId,ok,msg){
  document.getElementById(id).className='dot '+(ok===null?'wait':ok?'ok':'bad');
  document.getElementById(msgId).textContent=msg;
}
function updateSummary(){
  const s1=document.getElementById('d1').className.includes('ok');
  const s2=document.getElementById('d2').className.includes('ok');
  const el=document.getElementById('summary');
  if(!document.getElementById('d1').className.includes('wait') && !document.getElementById('d2').className.includes('wait')){
    if(s1&&s2){
      el.innerHTML='<div class="box summary-ok"><b>✅ 회사망에서 GitHub 읽기 전부 정상.</b><br>실시간 공유 대시보드 구축 가능. 아래 쓰기 테스트까지 통과하면 바로 다음 단계로 진행합니다.</div>';
    }else{
      el.innerHTML='<div class="box summary-bad"><b>⚠️ 일부 차단됨.</b><br>차단된 항목을 Claude에게 그대로 알려주세요 — 우회 경로를 다시 설계합니다.</div>';
    }
  }
}
// ① raw.githubusercontent.com
fetch('https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/README.md', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(t=>{ setRow('d1','m1',true,'OK ('+t.length+' bytes)'); updateSummary(); })
  .catch(e=>{ setRow('d1','m1',false,String(e)); updateSummary(); });

// ② api.github.com
fetch('https://api.github.com/repos/'+OWNER+'/'+REPO, {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{ setRow('d2','m2',true,'OK ('+d.full_name+')'); updateSummary(); })
  .catch(e=>{ setRow('d2','m2',false,String(e)); updateSummary(); });

// ③ 쓰기 테스트 (버튼)
document.getElementById('btnWrite').onclick = async ()=>{
  const tok = document.getElementById('tok').value.trim();
  if(!tok){ alert('토큰을 입력해주세요'); return; }
  document.getElementById('rowWrite').style.display='flex';
  setRow('d3','m3',null,'요청 중…');
  try{
    const content = btoa(unescape(encodeURIComponent('연결테스트 '+new Date().toISOString())));
    const path='data/_connectivity_test.txt';
    // 기존 파일 sha 조회 (있으면 업데이트, 없으면 신규 생성)
    let sha=undefined;
    const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
      { headers:{Authorization:'token '+tok} });
    if(getRes.ok){ const j=await getRes.json(); sha=j.sha; }
    const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
      method:'PUT',
      headers:{Authorization:'token '+tok, 'Content-Type':'application/json'},
      body: JSON.stringify({ message:'connectivity test', content, sha })
    });
    if(!putRes.ok){ const j=await putRes.json().catch(()=>({})); throw new Error('HTTP '+putRes.status+' '+(j.message||'')); }
    setRow('d3','m3',true,'OK — 커밋 성공 (data/_connectivity_test.txt)');
  }catch(e){
    setRow('d3','m3',false,String(e));
  }
};
</script>
</body></html>
